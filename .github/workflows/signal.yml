name: ELITE 訊號推送

on:
  schedule:
    # 每 5 分鐘跑一次（UTC，與時區無關）
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 允許手動觸發（在 Actions 頁面按 Run workflow 測試）

# 允許 workflow 寫回 repo（保存去重狀態 state.json）
permissions:
  contents: write

# 避免同時跑多個（前一次還沒跑完就被下一次蓋掉）
concurrency:
  group: elite-signal
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行偵測
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SCORE_MIN: "70"
          TOP_N: "40"
          COOLDOWN_HOURS: "4"
          ENABLE_SCORE: "1"
          ENABLE_DIVERGENCE: "1"
          ENABLE_ANOMALY: "1"
        run: python detect.py

      - name: 保存去重狀態
        run: |
          git config user.name "elite-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git commit -m "update state [skip ci]" || echo "無變更"
          git push || echo "push 略過"
